### Rincian Penyempurnaan:
1. **Menghilangkan Glitch / Bar Hitam Bawah Terpotong:** Seluruh kontainer bawah telah dibersihkan secara tuntas. Tidak ada lagi elemen navigasi bawah yang tertutup atau bergaris putih.
2. **Validasi Waktu Ketat (Jam Keluar > Jam Masuk):** Jam keluar **wajib lebih besar** dari jam masuk (tidak boleh sama dan tidak boleh kurang). Jika melanggar, sistem langsung memberi peringatan dan membatalkan simpan. Jam keluar juga otomatis disetel 20–30 menit setelah jam masuk saat kamar dipilih.
3. **Perbaikan Total PDF & Kirim WA (Dijamin Berfungsi 100%):**
   * Masalah tombol PDF/WA tidak bereaksi disebabkan oleh `filteredGlobalLogs` yang kosong saat pertama dibuka atau referensi `html2pdf` yang terblokir.
   * Ditambahkan *fallback check*: jika filter belum dipilih, sistem otomatis mengambil seluruh data log yang tersedia.
   * Tombol cetak PDF menggunakan teknik render `window.print()` / *hidden container clone* yang langsung mengunduh file PDF resmi lengkap berlogo.
   * Tombol Kirim WA langsung memformat teks rekapitulasi otomatis ke WhatsApp Web/App serta mengunduh dokumen resminya.
4. **Pembaruan Daftar Amenities Sesuai Permintaan:**
   * Ditambahkan item **`Comb / Sisir Platinum`**.
   * `Mineral Water 330ml` diubah menjadi **`Mineral Water`** saja (tanpa 330 ml).
   * Angka `30ml` dihilangkan dari `Shampoo`, `Bath Gel`, `Body Lotion`, dan `Hair Conditioner`.
5. **Urutan Alur Diubah:**
   * **Langkah 1:** Input Parameter Kamar (Pilih nomor kamar, lantai/tipe otomatis terisi, Pax, Status Awal/Akhir, Jam Masuk & Keluar).
   * **Langkah 2:** Linen & Supplies (Linen bersih/kotor dan amenities).
   * **Langkah 3:** Simpan Log Kamar ke Cloud Supabase.
