<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Boy Control Sheet & Log - Platinum Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen p-2 md:p-6">

    <!-- Container Utama Aplikasi -->
    <div id="mainApp" class="max-w-6xl mx-auto bg-slate-50 min-h-screen rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-slate-900 text-white p-4 flex justify-between items-center border-b border-amber-500/30">
            <div>
                <h1 class="text-sm md:text-lg font-bold font-serif uppercase tracking-wide">Platinum Hotel & Convention Hall</h1>
                <p class="text-xs text-amber-400 font-semibold">Housekeeping Digital Log System</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="userInfo" class="text-xs font-bold text-amber-300">👤 Staff Housekeeping</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 md:p-6 space-y-6 flex-1">
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Form Input Log Kamar -->
                <div class="lg:col-span-1 bg-white p-5 rounded-xl shadow-md border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-4 border-b pb-2 flex items-center justify-between">
                        <span>📝 Input Log Kamar</span>
                        <span class="text-xs font-normal text-slate-500">Form Control</span>
                    </h2>
                    
                    <form id="roomLogForm" class="space-y-4 text-xs md:text-sm">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Nomor Kamar</label>
                            <input type="text" id="roomNumber" required placeholder="Contoh: 301" class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Status Kamar</label>
                            <select id="roomStatus" required class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                <option value="VC">VC - Vacant Clean</option>
                                <option value="VD">VD - Vacant Dirty</option>
                                <option value="OC">OC - Occupied Clean</option>
                                <option value="OD">OD - Occupied Dirty</option>
                                <option value="OO">OO - Out of Order</option>
                                <option value="ED">ED - Expected Departure</option>
                            </select>
                        </div>

                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Nama Room Boy</label>
                            <input type="text" id="roomBoyName" required placeholder="Nama Petugas" class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Catatan / Remarks</label>
                            <textarea id="roomRemarks" rows="2" placeholder="Catatan tambahan (Opsional)" class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                        </div>

                        <button type="submit" id="btnSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg shadow uppercase transition-all duration-200">
                            ➕ Simpan Data Log
                        </button>
                    </form>
                </div>

                <!-- Tabel Data Log -->
                <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow-md border border-slate-200 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">
                                📋 Control Sheet & Log
                            </h2>
                            <button id="btnPrint" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition-all">
                                🖨️ Cetak / PDF
                            </button>
                        </div>

                        <div id="printArea" class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-700 border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-800 uppercase text-[11px] border-b border-slate-300">
                                        <th class="p-2.5">Waktu</th>
                                        <th class="p-2.5">No. Kamar</th>
                                        <th class="p-2.5">Status</th>
                                        <th class="p-2.5">Room Boy</th>
                                        <th class="p-2.5">Catatan</th>
                                        <th class="p-2.5 text-center action-col">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="logTableBody" class="divide-y divide-slate-200">
                                    <tr>
                                        <td colspan="6" class="p-4 text-center text-slate-400">Memuat data log...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-slate-100 border-t border-slate-200 p-3 text-center text-xs text-slate-500">
            &copy; Platinum Hotel & Convention Hall - Housekeeping Control System
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
