<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Boy Control Sheet & Log - Platinum Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen p-0 md:p-6">

    <!-- Container Utama Aplikasi (Langsung Tampil) -->
    <div id="mainApp" class="max-w-5xl mx-auto bg-slate-50 min-h-screen rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between">
        <header class="bg-slate-900 text-white p-4 flex justify-between items-center border-b border-amber-500/30">
            <div>
                <h1 class="text-sm md:text-lg font-bold font-serif uppercase">Platinum Hotel & Convention Hall</h1>
                <p class="text-xs text-amber-400 font-semibold">Housekeeping Digital Log System</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="userInfo" class="text-xs font-bold text-amber-300">👤 Staff Housekeeping</span>
            </div>
        </header>

        <main class="p-6">
            <p class="text-center text-slate-600 text-sm">Aplikasi siap digunakan tanpa login.</p>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
