<!-- ================= HEADER HOTEL DENGAN LOGO ASLI ================= -->
<header class="bg-[#0b1329] text-white p-4 md:p-5 border-b-2 border-[#caa365] flex flex-wrap justify-between items-center gap-4">
    
    <!-- Wadah Logo Resmi: Diberi background putih elegan agar teks hitam & lambang emas logo asli terlihat kontras dan tajam -->
    <div class="flex items-center gap-3 md:gap-4">
        <div class="bg-white px-3 py-2 rounded-xl shadow-md border border-[#caa365]/50 flex items-center justify-center">
            <img src="logo.webp" alt="Logo Platinum Hotel Balikpapan" class="h-10 md:h-12 w-auto object-contain">
        </div>
        
        <div class="border-l border-slate-700 pl-3 md:pl-4">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-amber-500/10 border border-amber-500/30 rounded-md text-[11px] font-bold text-amber-300 uppercase tracking-wider">
                📋 ROOM BOY CONTROL SHEET
            </span>
            <p class="text-[10px] text-slate-400 mt-0.5">Housekeeping Management Cloud System</p>
        </div>
    </div>

    <!-- Informasi Petugas & Shift -->
    <div class="bg-[#15213f] border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-4 shadow-inner">
        <div>
            <div class="text-xs font-bold text-purple-300 flex items-center gap-1">
                <span>👤</span> <span id="currentUserName">toni</span>
            </div>
            <div class="text-[11px] text-sky-400 mt-0.5 flex items-center gap-1">
                <span>🗓️</span> <span id="currentDateDisplay">--/--/--</span> 
                <span class="text-slate-500">|</span> 
                <span class="text-slate-300">Shift:</span> 
                <span id="currentShiftDisplay" class="text-amber-400 font-bold">Pagi</span>
            </div>
        </div>
        <button onclick="promptUserChange()" class="bg-[#42171d] hover:bg-rose-900 text-rose-200 border border-rose-700/40 text-xs px-3 py-1.5 rounded-lg font-semibold transition">
            Ganti Shift
        </button>
    </div>
</header>
