### Ringkasan Pembaruan:
1. **Sistem Autentikasi Penuh (Landing Page):** Terdapat popup Login & Registrasi Akun Staf resmi terintegrasi langsung ke tabel `hotel_users` Supabase.
2. **Akun Default Toni & Password `123456` Dihapus Total:** Petugas diwajibkan mendaftar akun baru sendiri melalui tab **"Daftar Akun Baru"**.
3. **UI/UX Luxury Hotel Standard:** Menggunakan tema *Navy & Gold* berpadu kartu putih bersih, persis dengan model sistem banquet.
4. **Bebas Glitch & Potongan:** Tombol ekspor (Excel, PDF, WA) berada di *Top Toolbar* sehingga tidak ada elemen yang tertutup atau terpotong.
5. **Logo Resmi Tersemat & PDF Utuh:** Dilengkapi logo vektor Base64 asli dan sistem cetak PDF resmi anti-blank.
