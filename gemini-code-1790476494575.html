<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Boy Control Sheet & Log - Platinum Hotel</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js](https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js)"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen p-0 md:p-6">

    <!-- Screen Login Overlay -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/30 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-lg font-black text-white uppercase tracking-widest font-serif">Platinum Hotel</h2>
                <p class="text-xs font-bold text-amber-400 uppercase">Room Boy Control Sheet Cloud</p>
            </div>

            <form id="loginForm" class="space-y-4 text-xs md:text-sm">
                <div>
                    <label class="block font-bold text-slate-300 uppercase mb-1">Email</label>
                    <input type="email" id="loginEmail" required placeholder="user@hotel.com" class="w-full p-3 bg-slate-800 border border-slate-700 text-white rounded-xl outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 uppercase mb-1">Password</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full p-3 bg-slate-800 border border-slate-700 text-white rounded-xl outline-none">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-xl uppercase">
                    🔑 Masuk System
                </button>
            </form>
        </div>
    </div>

    <!-- Application App Container -->
    <div id="mainApp" class="hidden max-w-5xl mx-auto bg-slate-50 min-h-screen rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between">
        <header class="bg-platinum-navy text-white p-4 flex justify-between items-center border-b border-amber-500/30">
            <div>
                <h1 class="text-sm md:text-lg font-bold font-serif uppercase">Platinum Hotel & Convention Hall</h1>
                <p class="text-xs text-amber-400 font-semibold">Housekeeping Digital Log System</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="userInfo" class="text-xs font-bold text-amber-300"></span>
                <button id="btnLogout" class="bg-red-500/20 text-red-300 border border-red-500/50 text-xs px-3 py-1.5 rounded-lg font-bold">Logout</button>
            </div>
        </header>

        <main class="p-6">
            <p class="text-center text-slate-600 text-sm">Aplikasi cloud siap dikembangkan lebih lanjut.</p>
        </main>
    </div>

    <!-- Script Execution -->
    <script type="module">
        import { loginUser, getCurrentUser, logoutUser } from './auth.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

            try {
                await loginUser(email, pass);
                initApp();
            } catch (err) {
                alert("Login Gagal: " + err.message);
            }
        });

        document.getElementById('btnLogout').addEventListener('click', logoutUser);

        async function initApp() {
            const user = await getCurrentUser();
            if (user) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('userInfo').innerText = `👤 ${user.fullName}`;
            }
        }

        initApp();
    </script>
</body>
</html>
